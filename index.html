<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Refaudio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Offline music player for your local files." />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS standalone / home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Refaudio" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/favicon.png" sizes="32x32" />
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__logo" aria-hidden="true"></div>
        <p class="boot__text">Loading Refaudio…</p>
      </div>
    </div>
    <noscript>Refaudio needs JavaScript enabled to play your local music.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
